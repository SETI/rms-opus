# Keep recorded data out of review, so that review reaches the code.
#
# Three directories hold generated data rather than written code: the mini-holdings
# fixture is real PDS archive metadata subsetted by a recorder, and the goldens are a
# serialized database, both rewritten wholesale by `python -m
# import_tests.tools.make_mini_holdings` and `... make_mini_goldens`. Nobody edits them by
# hand and there is nothing in them to review -- what makes them trustworthy is the two
# generators and the assertions, which are code and are reviewed.
#
# Left in, they do active harm. A regeneration touches hundreds of files at once and
# buries the handful of real code changes beside them, and CodeRabbit skips any pull
# request over its 100-file cap outright -- so a change of forty code files can go
# unreviewed because five hundred data files travelled with it.
#
# This is permanent rather than a workaround for one pull request: it will be true of
# every future fixture regeneration.
reviews:
  path_filters:
    - "!tests/fixtures/mini_holdings/**"
    - "!import_tests/goldens/**"
    - "!import_tests/fixtures/**"
