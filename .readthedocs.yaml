# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # The documentation build imports every OPUS module to generate the API
    # reference, so it installs the whole distribution -- and mysqlclient, a
    # runtime dependency, ships no Linux wheel. Without these the pip install
    # below fails while compiling it.
    - pkg-config
    - default-libmysqlclient-dev

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # The same gate the CI docs job and scripts/run-all-checks.sh apply: every
  # warning is a failure. conf.py sets `nitpicky`, so an unresolved
  # cross-reference is one of those warnings -- together they are `-W -n`.
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Install package with docs extra (dependencies from pyproject.toml)
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
