[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-opus"
dynamic = ["version"]
description = "OPUS: the Outer Planets Unified Search tool for the PDS Ring-Moon Systems Node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=4.2,<5",
  "django-storages",
  "hurry.filesize",
  "jinja2",
  "markupsafe",
  "mistune",
  "mysqlclient",
  "numpy>=1.26",
  "pdfkit",
  "pillow>=10.1",
  "pyparsing",
  "pytz",
  "pyyaml>=6.0.1",
  "qrcode",
  "regex",
  "requests",
  "rms-julian",
  "rms-pdsfile>=0.0.18",
  "rms-pdslogger",
  "rms-pdstable",
  "rms-translator",
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["pds", "planetary", "astronomy", "rings", "search", "opus"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-opus"
Documentation = "https://rms-opus.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-opus"
Source = "https://github.com/SETI/rms-opus"
Issues = "https://github.com/SETI/rms-opus/issues"

[project.optional-dependencies]
dev = [
  "rms-opus",
  "coverage>=7.0",
  # "mypy>=1.0",  # Enabled in Phase D (PR-14)
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-django>=4.5",
  "pytest-xdist>=3.8.0",
  "djangorestframework",
  "ruff>=0.8",
  "bandit[toml]>=1.8",
  "pyroma>=4.2",
  "vulture>=2.14",
  "rms-opus[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode: the per-package test directories carry no __init__.py, and the
# default "prepend" mode then requires test module basenames to be unique tree-wide. The
# first collision is already foreseeable — this PR adds tests/opus_import/test_cli.py and
# the remaining move PRs bring an opus_app and a log_analyzer with the same obvious name.
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = []
# Warnings are errors so a third-party deprecation cannot rot unnoticed. Add a
# narrowly-scoped "default::"/"ignore::" entry (with a comment) only for a
# warning coming from code we cannot fix.
filterwarnings = [
  "error",
  # rms-julian 3.0.1 builds its date grammar with pyparsing's deprecated
  # camelCase synonym `setParseAction`, so importing julian at all raises this.
  # Third-party on both sides and unavoidable. This is the only warning julian
  # raises on import (verified by capturing them all under
  # rms-julian==3.0.1 + pyparsing==3.3.1), so the filter names that one message
  # rather than the whole category. Fixed upstream in rms-julian 3.0.2;
  # requirements.txt still pins 3.0.1 for the integration runner, so this entry
  # goes away when that pin moves.
  "ignore:'setParseAction' deprecated - use 'set_parse_action':DeprecationWarning",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
# Only directories with an __init__.py are packages. Without this, the data and
# documentation directories inside opus_import (table_schemas, dictionary_data, docs)
# would each be picked up as a PEP 420 namespace package, making them importable and
# putting their contents outside the package-data rules below.
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]
# The import pipeline reads these at run time through importlib.resources, so they have
# to be inside the wheel: the JSON schemas that define every OPUS table (plus the README
# describing their format and the two lists of values deliberately left unmapped), and
# the PDS data dictionary sources that `--import-dictionary` reads.
"opus_import" = ["table_schemas/*", "dictionary_data/*"]

[tool.setuptools.exclude-package-data]
# include-package-data is on by default, which would otherwise ship the import
# pipeline's developer notes inside the wheel. They document how to add an instrument
# and how the database is laid out; PR-21 ports them into the Sphinx developer guide and
# deletes them.
"opus_import" = ["README.md", "docs/*.md"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/opus_config/_version.py"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Unit-coverage scope only (see plan §5a); the integration 100%-gate config is
# integration/.coveragerc, selected with COVERAGE_RCFILE.
source = ["opus_support", "opus_config", "opus_import", "opus_log_analyzer"]
omit = ["tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false
exclude = ["perf_test/"]

[[tool.mypy.overrides]]
module = "opus_config._version"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "perf_test",
  # Written by setuptools-scm at build time and git-ignored; not our code.
  "src/opus_config/_version.py",
  # The Django app's served static assets (JS/CSS/images). The one Python file
  # in there is Django's own vendored admin/js/compress.py, marked
  # linguist-vendored in .gitattributes; it is an asset, not project source.
  "src/opus_app/static",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# Global (documented) ignores — NOT the per-file burn-down table.
# PT011  - pytest.raises is too broad (template default).
# SIM105 - Use contextlib.suppress for suppressions (template default).
# SIM108 - Use ternary operator for simple if/else (template default).
# PT009/PT027 - self.assertEqual / self.assertRaises. The live-DB integration
#   suite (integration/apps_db_tests/*, integration/test_api/*) stays
#   unittest.TestCase permanently (plan PR-18), so these unittest->pytest-assertion
#   rules can never burn down and are ignored globally; PT018 and every other PT
#   rule stay enforced.
extend-ignore = ["PT011", "SIM105", "SIM108", "PT009", "PT027"]

[tool.ruff.lint.per-file-ignores]
# Burn-down list (plan PR-01). PR-17's exit criterion is that this table is empty.
#
# Legacy flake8 ignores that need real refactoring; retired through PR-17.
#     E501 - line too long;
#     E722 - bare `except:`;
#     F403 - `from module import *`; F405 - name may be undefined from star import;
#     N801 - invalid class name; N802 - invalid function name (legacy identifiers).
#
# The Django app and its live-DB suites carry only the three codes that still
# fire there: over a thousand E501 and 187 N801/N802, all of which PR-01
# assigned to PR-17. They are not burned down by the PR that moved the tree
# here, because reformatting and renaming on that scale is PR-17's work.
# E722/F403/F405 are absent from these globs deliberately: this tree contains no
# bare `except:`, and settings.py reads the secrets file through opus_config
# rather than a star import.
#
# `src/opus_support`, `src/opus_config`, `src/opus_import`, `tests` and
# `manage.py` have no row at all: they meet the full rule set.
"src/opus_app/**/*.py" = ["E501", "N801", "N802"]
"integration/**/*.py" = ["E501", "N801", "N802"]
"log_analyzer/**/*.py" = ["E722", "E501", "F403", "F405", "N801", "N802"]
#
# The PT015/B011 (`assert False`) and B006 (mutable default argument) sites
# PR-01 grandfathered here were fixed in PR-02, so their per-file ignores are
# gone.

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.bandit]
# Recurse the code trees; exclude the fixture- and live-server-driven suites
# (integration/{test_api,test_db_data,test_perf}) and the out-of-scope perf_test/.
# Targets shift to src/ as code moves; `tests/` is deliberately not a target.
# Path-anchored so a same-named directory elsewhere in the tree cannot match by
# accident. integration/apps_db_tests is deliberately absent: the per-app suites
# it holds are scanned.
exclude_dirs = [
  "perf_test", "venv", ".venv",
  "integration/test_api", "integration/test_perf", "integration/test_db_data",
]
targets = ["src", "integration", "log_analyzer", "manage.py"]
# Burn-down skip list (plan PR-01): category-level skips for existing patterns,
# each justified below. PR-17 shrinks these to individually-justified `# nosec`
# lines; PR-09 removes the `.extra()` sources (B610) and PR-12 formalizes SQL
# assembly (B608). B324 (weak MD5) was fixed in-code via usedforsecurity=False.
skips = [
  "B101",  # assert_used: asserts are internal invariants, not input validation.
  "B105",  # hardcoded_password_string: the only hit is the 'XXX' placeholder in
           # a secrets *template* (removed in PR-08); not a real credential.
  "B110",  # try_except_pass: legacy best-effort cleanup paths.
  "B113",  # request_without_timeout: internal log-analyzer API client.
  "B301",  # pickle: shelve/pickle over the tool's own locally-produced cache data.
  "B311",  # random: non-cryptographic fault injection (throw_random_*).
  "B403",  # import pickle/subprocess modules (imports alone are not the risk).
  "B404",
  "B506",  # yaml.load: parses a trusted, repo-bundled FAQ file via FullLoader.
  "B603",  # subprocess without shell: fixed, internal command invocations.
  "B607",  # start_process_with_partial_path: same internal invocations.
  "B608",  # hardcoded_sql: values are always %s-parameterized and identifiers are
           # validated; SQL assembly is formalized through a builder in PR-12.
  "B610",  # django_extra_used: the .extra() calls are removed in PR-09.
  "B704",  # markupsafe_markup_xss: internal log-analyzer HTML report generation.
]

# Enabled in PR-02 (after the dead-code removal). Genuine dead code is
# deleted; irreducible false positives live in vulture_whitelist.py (which is
# passed as an input path so its names count as used). PR-17 shrinks the
# whitelist. Paths shift toward src/ as code moves; they are also set via
# OPUS_VULTURE_PATHS (run-all-checks.sh) and VULTURE_PATHS (run-tests.yml).
# tests/ is scanned too: its own dead imports are caught, and names that only
# the suite uses then count as used.
[tool.vulture]
paths = ["src", "integration", "log_analyzer", "tests", "manage.py", "vulture_whitelist.py"]
exclude = ["*/perf_test/*"]
min_confidence = 70
