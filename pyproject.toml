[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-opus"
dynamic = ["version"]
description = "OPUS: the Outer Planets Unified Search tool for the PDS Ring-Moon Systems Node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<6",
  "jinja2",
  "markupsafe",
  "mysqlclient",
  "numpy>=1.26",
  "pdfkit",
  "pillow>=10.1",
  "pyparsing",
  "pytz",
  "pyyaml>=6.0.1",
  "qrcode",
  "regex",
  "requests",
  "rms-julian",
  "rms-pdsfile>=0.0.18",
  "rms-pdslogger",
  "rms-pdstable",
  "rms-translator",
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["pds", "planetary", "astronomy", "rings", "search", "opus"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-opus"
Documentation = "https://rms-opus.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-opus"
Source = "https://github.com/SETI/rms-opus"
Issues = "https://github.com/SETI/rms-opus/issues"

[project.optional-dependencies]
dev = [
  "rms-opus",
  "coverage>=7.0",
  # mypy carries no bound of its own: django-stubs' `compatible-mypy` extra below
  # pins it to the range that django-stubs' plugin supports, so the two cannot drift
  # apart on an unpinned install, and a second bound here would only go stale.
  "mypy",
  # django-stubs types the Django app. Its plugin reads the settings module, so every
  # job that runs mypy needs OPUS_CONFIG set.
  "django-stubs[compatible-mypy]>=5.1",
  # typeshed's stubs for mysqlclient, so the MySQL import backend is really checked
  # rather than silenced by an ignore_missing_imports entry.
  "types-mysqlclient",
  # typeshed's stubs for requests, needed by opus_import/util/retrieve_ra_dec.py
  # and opus_log_analyzer/opus/slug.py. requests ships py.typed from 2.33 but the
  # requirements.txt pin the integration runner installs is older and does not,
  # so without this entry the type gate passes on the GitHub job and fails on a
  # venv built from the pins. See the dependency-skew note in the plan.
  "types-requests",
  # typeshed's stubs for pytz, which opus_log_analyzer/cronjob_utils.py imports
  # to fix the cron reports' timezone.
  "types-pytz",
  # typeshed's stubs for regex, which apps/search/views.py uses for the
  # user-supplied regular expressions a string search accepts.
  "types-regex",
  # typeshed's stubs for qrcode, which apps/help/views.py renders into the
  # "How to Cite OPUS" page.
  "types-qrcode",
  # typeshed's stubs for docutils, whose node types docs/conf.py annotates its
  # missing-reference handler with. Sphinx itself ships py.typed.
  "types-docutils",
  "pymarkdownlnt>=0.9.35",
  # Floor set by CVE-2025-71176: pytest through 9.0.2 creates
  # /tmp/pytest-of-<user> with predictable permissions, so a local user on a
  # shared UNIX box can cause a denial of service or possibly gain privileges.
  # This floor governs `pip install -e ".[dev]"` -- the GitHub-hosted jobs and
  # developer installs -- which the lockfile does not constrain at all.
  # requirements.in carries the same floor; the requirements.txt compiled from
  # it pins an exact version, and the self-hosted runner installs from that
  # lockfile rather than from these extras.
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "pytest-django>=4.5",
  "pytest-xdist>=3.8.0",
  "djangorestframework",
  "ruff>=0.8",
  "bandit[toml]>=1.8",
  "pyroma>=4.2",
  "vulture>=2.14",
  "rms-opus[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

[tool.pytest.ini_options]
# The default run is directory-scoped, not marker-filtered: `pytest` alone collects the
# holdings-free unit suite and nothing else, so it never reaches integration_tests/,
# which needs an imported database and the PDS holdings behind it. That tree is a
# root-level sibling of this one precisely so this selection works; asking for it by
# name (`pytest integration_tests`) is the only way to run it. Nothing is filtered out
# of the default run with -m. That is a deliberate departure from the "exclude the
# heavy tier with -m" advice in .cursor/rules/python_testing.mdc: here the heavy tier
# is a whole directory rather than tests scattered through one, so selecting by path
# says the same thing and cannot be defeated by a test that forgets its marker.
testpaths = ["tests"]
# pytest-django configures Django once per session, which is what lets a unittest.TestCase
# under integration_tests/ reach the imported schema and what lets tests/opus_app/ import
# the app's views. It reads the OPUS configuration through opus_app.settings, so every
# pytest run needs OPUS_CONFIG set: tests/fixtures/opus_ci.toml for the holdings-free
# suite (the GitHub-hosted workflow and scripts/run-all-checks.sh both set it), the real
# installation's file for the integration suites.
DJANGO_SETTINGS_MODULE = "opus_app.settings"
# importlib import mode: the per-package test directories carry no __init__.py, and the
# default "prepend" mode then requires test module basenames to be unique tree-wide.
# tests/opus_import/test_package_data.py and tests/opus_log_analyzer/test_package_data.py
# are exactly that collision, and both collect under this mode.
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
# --strict-markers is on, so every marker used anywhere has to be declared here.
# integration_tests/conftest.py applies `integration` to everything it collects;
# `holdings` and `livetest` are module-level pytestmarks on the one module each
# describes. Nothing in tests/ is marked.
markers = [
  "integration: needs the OPUS database a full import populated (integration_tests/ only)",
  "holdings: reads a product file out of the PDS holdings tree, not just the database row naming it",
  "livetest: queries an OPUS server outside this process rather than the in-process application",
]
# Warnings are errors so a third-party deprecation cannot rot unnoticed. Add a
# narrowly-scoped "default::"/"ignore::" entry (with a comment) only for a
# warning coming from code we cannot fix.
filterwarnings = [
  "error",
  # rms-julian 3.0.1 builds its date grammar with pyparsing's deprecated
  # camelCase synonym `setParseAction`, so importing julian at all raises this.
  # Third-party on both sides and unavoidable. This is the only warning julian
  # raises on import (verified by capturing them all under
  # rms-julian==3.0.1 + pyparsing==3.3.1), so the filter names that one message
  # rather than the whole category. Fixed upstream in rms-julian 3.0.2;
  # requirements.txt still pins 3.0.1 for the integration runner, so this entry
  # goes away when that pin moves.
  "ignore:'setParseAction' deprecated - use 'set_parse_action':DeprecationWarning",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
# Only directories with an __init__.py are packages. Without this, the data
# directories inside opus_import (table_schemas, dictionary_data) would each be picked
# up as a PEP 420 namespace package, making them importable and putting their contents
# outside the package-data rules below.
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]
# The import pipeline reads these at run time through importlib.resources, so they have
# to be inside the wheel: the JSON schemas that define every OPUS table (plus the two
# lists of values deliberately left unmapped), and the PDS data dictionary sources that
# `--import-dictionary` reads.
"opus_import" = ["table_schemas/*", "dictionary_data/*"]
# The log analyzer's Jinja report templates, loaded by package name (jinja2's
# PackageLoader) rather than from the working directory, so an installed analyzer can
# render HTML reports.
"opus_log_analyzer" = ["templates/*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/opus_config/_version.py"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Unit-coverage scope only (see plan §5a); the integration 100%-gate config is
# integration_tests/.coveragerc, selected with COVERAGE_RCFILE.
source = ["opus_support", "opus_config", "opus_import", "opus_log_analyzer"]
omit = ["tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  # Never executed by construction: a TYPE_CHECKING block is False at run time,
  # and an @overload stub is a signature declaration whose body is `...`. Kept in
  # step with integration_tests/.coveragerc, which needs the same two.
  "if TYPE_CHECKING:",
  "@overload",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false
plugins = ["mypy_django_plugin.main"]
# With explicit_package_bases, a module's name is taken from the first package base
# that contains it: mypy_path's src/ (so src/opus_support/units.py is
# opus_support.units) or the working directory (so tests/opus_import/test_cli.py is
# tests.opus_import.test_cli). Both are load-bearing. The per-package test
# directories carry no __init__.py, so without this a test module would be named
# after its own file: the two test_package_data.py files would collide as one module
# name, and the burn-down list below could not name a test package at all. It also
# means mypy has to run from the repository root, which run-all-checks.sh and the
# lint job both do.
# `docs/_ext` is here so that the documentation build's own extensions are checked
# like everything else, and so that the tests importing them resolve.
mypy_path = "src:docs/_ext"
explicit_package_bases = true
exclude = [
  # Out of scope for this plan, like every other tool's configuration.
  "perf_test/",
  # Sphinx's build output, which is git-ignored and holds nothing written here.
  "docs/_build/",
  # Written by setuptools-scm at build time and git-ignored, so it is present only
  # after an install and would make the checked set depend on that. Nothing imports it.
  "src/opus_config/_version\\.py$",
  # Django's own vendored asset script, marked linguist-vendored in
  # .gitattributes. It is the only Python file under the Django app's served static
  # assets, and it is named exactly rather than excluding that whole tree, so any
  # Python placed there later is checked rather than silently skipped. (ruff
  # excludes the whole assets directory instead.)
  "src/opus_app/static/admin/js/compress\\.py$",
]

[tool.django-stubs]
# django-stubs resolves model and settings types by importing the settings module, so
# it needs OPUS_CONFIG set. run-all-checks.sh defaults it to tests/fixtures/opus_ci.toml
# and run-tests.yml sets it for every job.
django_settings_module = "opus_app.settings"

# Third-party packages that ship neither annotations nor a typeshed stub package.
# Where typeshed has one, the stub distribution goes in the dev extras instead and the
# package does not belong here -- that is a real check rather than a silenced one.
# Every package the repository imports either has an entry here or is checked: with
# the burn-down list gone there is nowhere left for an unannotated import to be
# reported and ignored, so a new dependency without annotations shows up as
# import-untyped on the first run and is answered here, deliberately.
# `rest_framework` is here rather than in the dev extras because typeshed carries no
# stub package for it: the stubs that exist are a separate third-party distribution
# that re-types Django's own request and response classes, which would put a second
# opinion about them beside django-stubs for the sake of the one name the suite
# imports (`RequestsClient`, used only on the live-server path).
[[tool.mypy.overrides]]
module = ["julian.*", "pdfkit.*", "pdsfile.*", "pdslogger.*", "pdsparser.*",
          "pdstable.*", "rest_framework.*"]
ignore_missing_imports = true

# The type burn-down list is gone (plan PR-17, completed by PR-17b): `strict = true`
# applies to the whole repository and no module is silenced by an `ignore_errors`
# entry, because that list is empty. **That is the whole of the claim.** Suppression
# has not vanished from this file and nobody should read it that way: `exclude` above
# still holds the paths that are not project source, and the `ignore_missing_imports`
# override above still covers the third-party packages that ship neither annotations
# nor a typeshed stub. Read both lists above rather than trusting a count here; each
# entry is documented where it sits.
#
# Nothing belongs here again. A tree that cannot pass the checker yet is not a
# configuration problem: annotate it in the PR that owns it, or say at the site --
# with the reason -- what the checker cannot see, which is what `# type: ignore[...]`
# is for. `warn_unused_ignores` is on under `strict`, so each of those has to keep
# earning its place.

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "perf_test",
  # Sphinx's build output. Nothing in it is written here.
  "docs/_build",
  # Written by setuptools-scm at build time and git-ignored; not our code.
  "src/opus_config/_version.py",
  # The Django app's served static assets (JS/CSS/images). The one Python file
  # in there is Django's own vendored admin/js/compress.py, marked
  # linguist-vendored in .gitattributes; it is an asset, not project source.
  "src/opus_app/static",
  # Machine-written by scripts/models/create_opus_models.sh (manage.py inspectdb
  # plus a sed pipeline), so nothing hand-edited here survives the next
  # regeneration. That script formats its own output with `ruff format`, which
  # ruff applies to an explicitly named path regardless of this exclusion.
  # Excluding it also means the 231 generated model classes and their nested
  # Meta classes carry no docstrings and are not expected to: writing them would
  # flood the Sphinx API reference PR-21 publishes with entries no reader gains
  # anything from, and the next regeneration would delete them anyway. This is a
  # permanent exclusion like the two above, not a burn-down entry, and does not
  # affect the per-file-ignores table.
  "src/opus_app/apps/search/models.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# Global (documented) ignores — NOT the per-file burn-down table.
# PT011  - pytest.raises is too broad (template default).
# SIM105 - Use contextlib.suppress for suppressions (template default).
# SIM108 - Use ternary operator for simple if/else (template default).
# PT009/PT027 - self.assertEqual / self.assertRaises. The live-DB integration
#   suite (integration_tests/apps_db_tests/*, integration_tests/test_api/*) stays
#   unittest.TestCase permanently (plan PR-18), so these unittest->pytest-assertion
#   rules can never burn down and are ignored globally; PT018 and every other PT
#   rule stay enforced.
# E501  - line too long. Retired here (plan rev 7.20) rather than burned down,
#   because from PR-23 onward `ruff format` is what enforces layout, and E501's
#   entire residue is tokens no formatter can split. Regenerate the measurement
#   rather than trusting these numbers: empty the per-file-ignores table below
#   and run `ruff check`, then run `ruff format` over the same paths and run it
#   again. Measured that way at this PR (ruff 0.16.4): 1267 before formatting,
#   718 after, and 678 of those 718 are in integration_tests -- single URL query
#   strings and PDS file paths inside the golden-response fixtures, each one
#   literal with nothing to break at. Splitting them means 678 hand-edits to the
#   suite that is this rewrite's primary safety net, in the implicit-string-
#   concatenation defect class that produced the fused 'cm^-1perpixel' alias bug
#   PR-03a fixed. `line-length` stays 100 and still governs the formatter.
extend-ignore = ["PT011", "SIM105", "SIM108", "PT009", "PT027", "E501"]

[tool.ruff.lint.per-file-ignores]
# Empty, and that is PR-01's exit criterion met (plan PR-17, finished by PR-17b).
# Every tree in RUFF_PATHS passes with no *per-file* exception. That is what an empty table means and all it means:
# the codes in `extend-ignore` above are still ignored globally, and `exclude` above
# still lists the paths that are not project source. What the burn-down held, and
# where each entry went:
#
#   E722, F403/F405   the bare `except:` and the star imports were refactored away
#                     by the PRs that owned those trees.
#   PT015, B011, B006 `assert False` and the mutable default arguments were fixed in
#                     PR-02.
#   E501              retired into the documented global ignore above rather than
#                     burned down; the reasoning is stated there.
#   N801, N802        the last row. The live-DB suites' classes and test methods now
#                     read `CartTests` and `test__api_meta_mults_coiss_2111`; a PDS
#                     bundle identifier keeps its shape in lower case.
#
# A new row is not the way to land code that does not pass. Fix the code, or suppress
# the one rule on the one line with `# noqa: <CODE>` and the reason, which `RUF100`
# then keeps honest by failing when it stops being needed.

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.bandit]
# Recurse the code trees; exclude the fixture- and live-server-driven suites
# (integration_tests/{test_api,test_db_data,test_perf}) and the out-of-scope
# perf_test/.
# Every code tree is under src/ now; `tests/` is deliberately not a target.
# Path-anchored so a same-named directory elsewhere in the tree cannot match by
# accident. integration_tests/apps_db_tests is deliberately absent: the per-app suites
# it holds are scanned.
exclude_dirs = [
  "perf_test", "venv", ".venv",
  "integration_tests/test_api", "integration_tests/test_perf",
  "integration_tests/test_db_data",
  # Django's own vendored asset script, marked linguist-vendored in
  # .gitattributes. It is third-party code we do not edit, so its subprocess use
  # is not ours to annotate; skipping it here is what retired the B404/B603
  # category skips. Named exactly rather than excluding the whole static tree, so
  # any Python placed there later is scanned rather than silently skipped -- the
  # same choice [tool.mypy] exclude makes about this file.
  "src/opus_app/static/admin/js/compress.py",
]
targets = ["src", "integration_tests", "manage.py"]
# PR-01 opened this list with fourteen category skips as a burn-down valve, and
# PR-17a closed it down to the one entry that is irreducible. Everything else is
# a per-line `# nosec <ID> - <reason>` at the statement it covers; regenerate the
# set with `grep -rn "# nosec" src integration_tests manage.py`, and re-derive
# what the list is holding back by emptying it and re-running bandit.
#
# B105 left in PR-08 (the 'XXX' placeholder went with the dictionary app's
# secrets template) and B610 in PR-12 (all four QuerySet.extra() sites are gone).
# B607 left here: it fired zero times, and a skip that suppresses nothing is a
# claim about the code that is no longer true.
#
# Expect bandit to log "nosec encountered (Bxxx), but no failed test on
# file X:N" lines on a clean run. That is not a misplaced marker: bandit runs
# each check against every candidate node, attaches a `# nosec` to the whole
# statement's line range, and warns for each node in that range the check did
# not fire on -- so a statement holding several string or call nodes emits one
# warning per node that was fine. A bare `# nosec` silences the warnings by
# suppressing every check on the line, which is worse, so the markers name their
# test id and the warnings stand. The exit status is what gates.
skips = [
  # assert_used. These are not input validation and never were: they are the
  # narrowing assertions PR-14, PR-15 and PR-16 added so that mypy strict could
  # follow an invariant the code already relied on, plus a few pre-existing
  # invariant checks. Do not trust the number below without re-measuring -- it
  # grows with every annotation PR. Regenerate it with `skips` emptied and
  # `--ignore-nosec`, which is the only way to see what the list is holding back:
  #     bandit -c pyproject.toml -r src integration_tests manage.py \
  #            -f json -q --ignore-nosec
  # Measured that way on the PR-17b tree: 326 B101 findings -- 199 in
  # src/opus_import, 90 in src/opus_app, 17 in src/opus_log_analyzer, 16 in
  # src/opus_support and 4 in integration_tests/apps_db_tests. (PR-17a measured
  # 322 without that last group, which is the four narrowing assertions PR-17b
  # added; a PR that annotates anything bandit scans moves this number, which is
  # why the command is written out above rather than the figure being trusted.)
  # The largest share is in other packages' trees, but every annotation PR has
  # contributed its own, so this is not a skip that only covers somebody else's
  # code. A per-line `# nosec` on each would be 326 comments restating one fact,
  # which is the noise this list was shrunk to avoid. Python's -O strips asserts,
  # and nothing here is deployed with -O; if that ever changes, these become real
  # checks and this skip has to be revisited rather than kept.
  "B101",
]

# Enabled in PR-02 (after the dead-code removal). Genuine dead code is
# deleted; irreducible false positives live in vulture_whitelist.py (which is
# passed as an input path so its names count as used). PR-17 shrinks the
# whitelist. The same paths are also set via OPUS_VULTURE_PATHS
# (run-all-checks.sh) and VULTURE_PATHS (run-tests.yml).
# tests/ is scanned too: its own dead imports are caught, and names that only
# the suite uses then count as used.
[tool.vulture]
paths = ["src", "integration_tests", "tests", "docs", "manage.py",
         "vulture_whitelist.py"]
# Vulture is invoked with relative paths, so a pattern needing a component before
# the directory name would never match. These are written both ways for that
# reason.
exclude = ["*/perf_test/*", "perf_test/*", "*/docs/_build/*", "docs/_build/*"]
min_confidence = 70
