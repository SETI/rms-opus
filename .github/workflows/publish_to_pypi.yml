name: Publish to PyPI
run-name: Publish to PyPI triggered by ${{ github.ref_type }} ${{ github.ref_name }}

on:
  release:
    types: [published]

# Publishes with an API token, not Trusted Publishing, so it needs no
# `id-token: write`. Switching to OIDC would have to grant it.
permissions:
  contents: read

jobs:
  upload_pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # setuptools-scm derives the released version from the tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install --upgrade build && python -m build

      - name: Validate package
        # --strict makes a long-description rendering warning an error; without it
        # twine exits 0 and the release ships a broken project page.
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
