name: Publish to Test PyPI
run-name: Publish to Test PyPI triggered by ${{ github.ref_type }} ${{ github.ref_name }}

on:
  workflow_dispatch:

# This workflow publishes with an API token (the `password` input below), not
# with Trusted Publishing, so it needs no `id-token: write`. Adding a job here
# that publishes via OIDC instead would have to grant it explicitly.
permissions:
  contents: read

jobs:
  upload_pypi:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA with the release in a
      # trailing comment, in every workflow in this repository. See the longer
      # note in run-integration.yml for why, and for how to move a pin.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # setuptools-scm derives the version from the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: 3.12

      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install --upgrade build && python -m build

      - name: Validate package
        # The same validation publish_to_pypi.yml runs. A dry run that skips the
        # check the real run makes is not a dry run of it.
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
