name: Run Tests
run-name: "Run Tests: ${{ github.ref_type }} ${{ github.ref_name }} by ${{ github.triggering_actor }}"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, rewrite ]
  push:
    branches: [ main, rewrite ]
  schedule:
    - cron: "55 10 * * *"  # 2:55am PST, 3:55am PDT

defaults:
  run:
    shell: bash

# The repository's default workflow token permission is write; no job here writes
# anything back to GitHub, so all of them are narrowed to reading the repository.
permissions:
  contents: read

env:
  # OPUS has no default location for its configuration file, so every process
  # that reads OPUS settings is given one. This dummy configuration (dummy
  # credentials, paths under /tmp) is what every GitHub-hosted job runs against:
  # they have neither PDS holdings nor a populated database. The path is relative
  # to the checkout, which is each job's working directory.
  OPUS_CONFIG: tests/fixtures/opus_ci.toml

jobs:
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    # Without this, a hung runner burns GitHub's 6-hour default before failing.
    # The tools themselves run in well under a minute; the apt-get and pip steps
    # are what take the time, and they are the network-dependent ones.
    timeout-minutes: 30
    env:
      # The importable packages live under src/; the live-DB suites are in
      # integration_tests/, the holdings-free import suite in import_tests/, the
      # unit suite in tests/, the documentation build's own extensions in docs/,
      # manage.py at the root.
      # Vulture also scans vulture_whitelist.py so whitelisted names count as
      # used; min-confidence/exclude come from [tool.vulture] in pyproject.toml.
      # tests/ and docs/ are linted and vulture-scanned but never bandit-scanned.
      RUFF_PATHS: "src integration_tests import_tests tests docs manage.py"
      # The type gate covers every tree the other tools scan, and no tree carries
      # a burn-down entry: [tool.mypy]'s ignore_errors list is empty. That is the
      # whole claim -- its exclude lists the non-source paths and
      # ignore_missing_imports lists the untyped third-party packages. See
      # [tool.mypy] in pyproject.toml for both, and for why each entry is there.
      MYPY_PATHS: "src integration_tests import_tests tests docs manage.py"
      # import_tests/ is deliberately absent, like tests/: a test tree is not a
      # bandit target in this repository.
      BANDIT_PATHS: "src integration_tests manage.py"
      VULTURE_PATHS: "src integration_tests import_tests tests docs manage.py vulture_whitelist.py"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # setuptools-scm derives the version from tags, which a shallow clone
          # does not fetch; this job installs the package, so it needs them.
          fetch-depth: 0
          # Nothing here pushes or calls the GitHub API through git, so the token
          # does not need to be left behind in .git/config.
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so the
        # install below compiles it and needs the MySQL/MariaDB client
        # development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Install package and dev dependencies
        # mypy's django-stubs plugin imports opus_app.settings, so this job needs
        # the package and its runtime dependencies rather than the lint tools on
        # their own. Installing the dev extras also pins every tool in this job to
        # the same versions scripts/run-all-checks.sh uses locally.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the pdsfile rewrite
        # The rewrite, from its branch tip, until it ships to PyPI. It is not a
        # [project] dependency -- the published wheel declares the PyPI package -- so
        # every environment that installs or type-checks this one installs it here.
        # `opus_import` enables Pds4File.use_shelves_only(), and 0.0.18's empty-key
        # branch returns False with no fall-through, so from_path raises there on the
        # first PDS4 existence check. Tracking the tip rather than a frozen SHA is
        # deliberate: the rewrite is behavior-identical to 0.0.18 by its own contract,
        # and a lagging pin is the bigger risk.
        run: |
          python -m pip install "rms-pdsfile @ git+https://github.com/SETI/rms-pdsfile@rewrite"

      - name: Ruff (lint)
        run: |
          ruff check $RUFF_PATHS

      - name: Ruff (format)
        # Unconditional, like every other check in this job. It was guarded by an
        # ENABLE_RUFF_FORMAT variable while the repository was still unformatted;
        # that guard goes with the reformat, because a skipped step reports
        # success, so a guard that stopped matching would have retired this gate
        # behind a green check rather than a red one.
        #
        # A formatter's output is a property of its version: this compares the
        # tree against whatever ruff the install step resolved, so a ruff whose
        # style rules differ from the one that formatted the tree turns this red
        # on code nobody edited. Reformatting under the newer ruff is the fix, in
        # its own commit.
        run: |
          ruff format --check $RUFF_PATHS

      - name: Bandit
        run: |
          bandit -c pyproject.toml -r $BANDIT_PATHS -q

      - name: Vulture
        run: |
          vulture $VULTURE_PATHS

      - name: Mypy
        # Strict over the whole repository, with no module silenced by an
        # ignore_errors entry -- that list is empty. What remains is [tool.mypy]'s
        # own configuration: its exclude, for paths that are not project source,
        # and ignore_missing_imports, for third-party packages that ship no types.
        # OPUS_CONFIG comes from the workflow-level env above.
        run: |
          # shellcheck disable=SC2086  # MYPY_PATHS is a path list; splitting is intended
          mypy $MYPY_PATHS

      - name: PyMarkdown
        run: |
          pymarkdown scan README.md CONTRIBUTING.md .cursor/ docs/

  test:
    # Holdings-free unit tests. They need no database: the import suite that does
    # is its own job below, with a MySQL service container of its own.
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Without this, a hung runner burns GitHub's 6-hour default before failing
    # (observed 2026-08-19: a 3.12 job wedged for 40 min against a ~1 min
    # normal runtime while its 3.13 sibling passed). Includes the apt-get and
    # pip install steps, which are the network-dependent ones.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # setuptools-scm derives the version from tags, which a shallow
          # clone does not fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so it
        # is compiled here and needs the MySQL/MariaDB client development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the pdsfile rewrite
        # The rewrite, from its branch tip, until it ships to PyPI. It is not a
        # [project] dependency -- the published wheel declares the PyPI package -- so
        # every environment that installs or type-checks this one installs it here.
        # `opus_import` enables Pds4File.use_shelves_only(), and 0.0.18's empty-key
        # branch returns False with no fall-through, so from_path raises there on the
        # first PDS4 existence check. Tracking the tip rather than a frozen SHA is
        # deliberate: the rewrite is behavior-identical to 0.0.18 by its own contract,
        # and a lagging pin is the bigger risk.
        run: |
          python -m pip install "rms-pdsfile @ git+https://github.com/SETI/rms-pdsfile@rewrite"

      - name: Pytest
        # testpaths (= tests/) and the strict options come from pyproject.toml.
        run: |
          pytest -n auto --dist loadscope

  import-tests:
    # The holdings-free end-to-end test of the import pipeline: the checked-in
    # mini-holdings fixture is built into a temporary tree, the real
    # `opus_import` command line is run against it, and every table is compared
    # with a recorded run. Until this job existed the only test of the pipeline
    # was the ~35-minute self-hosted run against the real archive.
    #
    # Which command establishes which gate:
    #   * the import produced what the real holdings hold, and every table
    #     matches its golden -> the first pytest call. Its exit status is the
    #     gate for both, because the assertions are tests rather than log
    #     greps -- but note the pipeline's own steps report failure through
    #     ERRORS.log and still exit zero, which is why the suite reads the log.
    #   * unit coverage is at or above the floor -> the same call, through
    #     [tool.coverage.report] fail_under. This is the one job that measures
    #     it and the one number that gates it.
    #   * every obs function was executed rather than merely imported -> the
    #     second pytest call, which reads the JSON report the first one wrote.
    #     It is a separate call because that report does not exist until the
    #     session that produces it has ended.
    name: Import Tests
    runs-on: ubuntu-latest
    # The import of two dozen sampled volumes plus the assertions runs in a few
    # minutes; the apt-get and pip steps are the network-dependent ones.
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          # The suite creates and drops a schema per run, which the official
          # image grants only to root: MYSQL_USER is given privileges on one
          # named database and nothing else.
          MYSQL_ROOT_PASSWORD: opus_import_tests
        ports:
          - 3306:3306
        # Without a health check the first step starts while the server is
        # still initializing, which takes 10-30 seconds and makes the first
        # connection a flaky required check rather than a real one.
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Where the suite reaches the service container. OPUS_CONFIG comes from the
      # workflow-level env above, and pytest needs it here like everywhere else:
      # pytest-django configures Django from it at session start. The
      # configuration each pipeline subprocess reads is a different file, written
      # per run by the suite itself and pointing at the schema and the built tree.
      #
      # 127.0.0.1 rather than localhost: MySQLdb reads localhost as a request
      # for a Unix socket, which exists on a developer's machine and not beside
      # a service container.
      OPUS_TEST_DB_HOST: 127.0.0.1
      OPUS_TEST_DB_USER: root
      OPUS_TEST_DB_PASSWORD: opus_import_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # setuptools-scm derives the version from tags, which a shallow clone
          # does not fetch; this job installs the package.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so it
        # is compiled here and needs the MySQL/MariaDB client development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the pdsfile rewrite
        # The rewrite, from its branch tip, until it ships to PyPI. This
        # job is the one that cannot work without it: the suite runs the
        # pipeline with Pds4File.use_shelves_only() enabled, and 0.0.18 raises
        # on the first PDS4 existence check under that flag.
        run: |
          python -m pip install "rms-pdsfile @ git+https://github.com/SETI/rms-pdsfile@rewrite"

      - name: Pytest (import suite)
        # Serial on purpose: the run is one long import followed by fast
        # assertions, so xdist buys nothing, and a session-scoped fixture under
        # -n would run the whole import once per worker into the same schema.
        # The coverage scope is [tool.coverage.run]'s own source list in
        # pyproject.toml, so a bare --cov is what keeps this job and the
        # configuration from disagreeing. The JSON report is what the
        # executed-functions check reads in the next step.
        run: |
          pytest import_tests \
            --ignore=import_tests/test_obs_execution.py \
            --cov --cov-report=term-missing \
            --cov-report=xml:coverage.xml --cov-report=json:coverage.json

      - name: Every obs function executed
        # A separate invocation, because it reads the report the run above
        # wrote and that report does not exist until that session has ended.
        run: |
          pytest import_tests/test_obs_execution.py

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Its own flag, because this upload and the integration workflow's
          # measure different trees with different configurations; codecov.yml
          # gives each flag its own status and carries no unflagged default,
          # which would otherwise measure the two of them merged.
          flags: import
          verbose: true

  docs:
    # The Sphinx build. It imports every OPUS module to generate the API reference,
    # which is why it installs the package rather than Sphinx on its own, and why it
    # needs OPUS_CONFIG: importing opus_app.settings reads the configuration file.
    name: Docs
    runs-on: ubuntu-latest
    # The build itself takes a couple of minutes; the apt-get and pip steps take the
    # rest, and they are the network-dependent ones.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # conf.py reads the distribution version from the installed metadata, which
          # setuptools-scm derives from tags a shallow clone does not fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so it is
        # compiled here and needs the MySQL/MariaDB client development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Install the pdsfile rewrite
        # The rewrite, from its branch tip, until it ships to PyPI. It is not a
        # [project] dependency -- the published wheel declares the PyPI package -- so
        # every environment that installs or type-checks this one installs it here.
        # `opus_import` enables Pds4File.use_shelves_only(), and 0.0.18's empty-key
        # branch returns False with no fall-through, so from_path raises there on the
        # first PDS4 existence check. Tracking the tip rather than a frozen SHA is
        # deliberate: the rewrite is behavior-identical to 0.0.18 by its own contract,
        # and a lagging pin is the bigger risk.
        run: |
          python -m pip install "rms-pdsfile @ git+https://github.com/SETI/rms-pdsfile@rewrite"

      - name: Sphinx
        # -W turns every warning into an error and -n reports every cross-reference
        # that does not resolve: both gates in one build, matching what
        # scripts/run-all-checks.sh runs locally. OPUS_CONFIG comes from the
        # workflow-level env above.
        run: |
          sphinx-build -W -n -b html docs docs/_build

  package:
    # The release path, minus the upload. publish_to_pypi.yml builds the
    # distributions and validates them, then hands them to the PyPI publisher; that
    # workflow runs only when a release is published, so until this job existed
    # nothing exercised the build or the metadata until release day -- and a
    # packaging change that breaks either looks exactly like one that does not.
    # This runs the same build and the same validation on every push, and then does
    # what neither publish workflow can: installs the built wheel into a venv with
    # no checkout in sight and runs the commands the distribution promises.
    #
    # What is still NOT covered here, deliberately and unavoidably: the upload step
    # itself, the API tokens, and whatever PyPI decides about the metadata when it
    # receives it. Those are only exercised by a real publish.
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # setuptools-scm derives the version from tags, and the version is part
          # of what is being validated here.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        # The version both publish workflows build with, so this job builds the
        # same artifact they would.
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so
        # installing the built distribution below compiles it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Build
        # The same two commands publish_to_pypi.yml runs.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build && python -m build

      - name: Validate package
        # `twine check --strict` is what publish_to_pypi.yml runs; --strict makes a
        # rendering warning about the long description an error rather than a note
        # nobody reads in a release log.
        run: |
          python -m pip install twine pyroma
          python -m twine check --strict dist/*
          python -m pyroma .

      - name: Install the wheel into a clean environment and run what it promises
        # Run from a directory that is not the checkout: with the repository as the
        # working directory, `import opus_import` resolves through src/ for the
        # wrong reason and a wheel missing a package would still pass.
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          # The same interim install every other environment makes: the wheel
          # declares rms-pdsfile>=0.0.18, and the enabled Pds4File line does not
          # work there.
          "$RUNNER_TEMP/clean/bin/pip" install \
            "rms-pdsfile @ git+https://github.com/SETI/rms-pdsfile@rewrite"
          cd "$RUNNER_TEMP"
          export OPUS_CONFIG="$GITHUB_WORKSPACE/tests/fixtures/opus_ci.toml"
          "$RUNNER_TEMP/clean/bin/opus_import" --help > /dev/null
          "$RUNNER_TEMP/clean/bin/opus_log_analyzer" --help > /dev/null
          "$RUNNER_TEMP/clean/bin/opus_error_analyzer" --help > /dev/null
          # The package data the code reads at run time, resolved through
          # importlib.resources from the installed distribution rather than from a
          # source tree. A wheel that omits any of it installs and imports fine and
          # fails on the first real run.
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          import importlib.resources as res

          for package, name in [
              ('opus_import.table_schemas', 'obs_general.json'),
              ('opus_import.dictionary_data', 'contexts.csv'),
              ('opus_log_analyzer.templates', 'log_analysis.html'),
          ]:
              assert res.files(package).joinpath(name).is_file(), f'{package}/{name} missing'
          import opus_app.wsgi  # noqa: F401  -- what mod_wsgi imports on the server
          print('package data and the wsgi entry point are present')
          PY
