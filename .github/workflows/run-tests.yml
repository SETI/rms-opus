name: Run Tests
run-name: "Run Tests: ${{ github.ref_type }} ${{ github.ref_name }} by ${{ github.triggering_actor }}"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, rewrite ]
  push:
    branches: [ main, rewrite ]
  schedule:
    - cron: "55 10 * * *"  # 2:55am PST, 3:55am PDT

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    # Without this, a hung runner burns GitHub's 6-hour default before failing.
    # Real runtime is well under a minute; 15 leaves generous headroom.
    timeout-minutes: 15
    env:
      # Ruff formatting is not enforced until the format-only PR (PR-23); the
      # step below is kept but disabled, mirroring the ENABLE_* toggles in
      # scripts/run-all-checks.sh. PR-23 flips this to 'true'.
      ENABLE_RUFF_FORMAT: 'false'
      # Every code tree lives under src/ now; the live-DB suites are in
      # integration_tests/, the unit suite in tests/, manage.py at the root.
      # Vulture also scans vulture_whitelist.py so whitelisted names count as
      # used; min-confidence/exclude come from [tool.vulture] in pyproject.toml.
      # tests/ is linted and vulture-scanned but never bandit-scanned.
      RUFF_PATHS: "src integration_tests tests manage.py"
      BANDIT_PATHS: "src integration_tests manage.py"
      VULTURE_PATHS: "src integration_tests tests manage.py vulture_whitelist.py"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install lint tools
        # These tools only parse source, so this job installs them directly
        # rather than installing the package and its dependencies with
        # `pip install -e ".[dev]"` (which the test job below does). Tool
        # configuration still comes from pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff "bandit[toml]" vulture pymarkdownlnt

      - name: Ruff (lint)
        run: |
          ruff check $RUFF_PATHS

      - name: Ruff (format)
        if: ${{ env.ENABLE_RUFF_FORMAT == 'true' }}
        run: |
          ruff format --check $RUFF_PATHS

      - name: Bandit
        run: |
          bandit -c pyproject.toml -r $BANDIT_PATHS -q

      - name: Vulture
        run: |
          vulture $VULTURE_PATHS

      - name: PyMarkdown
        run: |
          pymarkdown scan README.md CONTRIBUTING.md .cursor/

  test:
    # Holdings-free unit tests. No database is needed yet; a MySQL service
    # container joins this job when the import test suite lands.
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Without this, a hung runner burns GitHub's 6-hour default before failing
    # (observed 2026-08-19: a 3.12 job wedged for 40 min against a ~1 min
    # normal runtime while its 3.13 sibling passed). Includes the apt-get and
    # pip install steps, which are the network-dependent ones.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # setuptools-scm derives the version from tags, which a shallow
          # clone does not fetch.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MySQL client headers
        # mysqlclient is a runtime dependency and ships no Linux wheel, so it
        # is compiled here and needs the MySQL/MariaDB client development files.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev build-essential

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        # testpaths (= tests/) and the strict options come from pyproject.toml.
        run: |
          pytest -n auto --dist loadscope
