# The web scenarios bench_web.py runs, and the servers it starts to run them.
# benchmarks/web_scenarios.py says what each scenario kind expands to.

[server]
# gunicorn: gthread workers, with as many connections per worker as threads. Four
# workers of two threads are the eight request slots of the mod_wsgi arrangement in
# docs/user_guide_web_server.rst.
port = 18321
workers = 4
threads = 2
# The harness's own memcached, on a port of its own, with this much item memory.
memcached_port = 21211
memcached_mb = 1024

# Whether each cold state runs the side's `opus_manage warm_search` after its restarts
# and before the scenario, as a deploy does once its workers start, so that state shows
# what a visitor meets after a deploy. bench_web --warm STATE sets one for a session. A
# side without the command skips it and records the step skipped.
[warm]
db-cold = false
app-cold = false

# Web runs per side in a floor session, by scale: the default of --runs. An A/B passes
# the count the run-count table in docs/dev_guide_benchmarks.rst gives it.
[runs]
fixture = 5
test = 5
complete = 3

# The searches the scenarios act on, as query strings.
[searches]
# The landing page: no selections, the default sort.
empty = ""
# Most of the data, by observation time.
broad = "time1=1980-01-01T00:00:00&time2=2018-01-01T00:00:00"
# A predicate matching under one percent of the test scale's observations, in the
# default sort.
selective = "planet=Uranus"
# A range on a child table, obs_ring_geometry, in kilometres.
ring_radius = "RINGGEOringradius1=60000&RINGGEOringradius2=140000"
# A target, which is a membership test on a list column.
target = "target=Saturn"
# One target's surface geometry.
surface_geometry = "surfacegeometrytargetname=Saturn&SURFACEGEOsaturn_planetographiclatitude1=-30&SURFACEGEOsaturn_planetographiclatitude2=30"
# The selections of the fan-out with selections: the broad time range and one mult.
selected = "time1=1980-01-01T00:00:00&time2=2018-01-01T00:00:00&planet=Saturn"
# Selections on four tables at once: a time range, an instrument and a target on
# obs_general and its target junction, a ring radius range on obs_ring_geometry, and a
# latitude range on Saturn's surface geometry.
complex = "time1=2004-01-01T00:00:00&time2=2018-01-01T00:00:00&instrument=Cassini+ISS&target=Saturn&RINGGEOringradius1=60000&RINGGEOringradius2=140000&surfacegeometrytargetname=Saturn&SURFACEGEOsaturn_planetographiclatitude1=-30&SURFACEGEOsaturn_planetographiclatitude2=30"
# A range on a column of obs_ring_geometry that leads no index, which finalization gives
# a histogram, with the broad time range on obs_general: which of the two tables the
# search reads first is decided by their estimated rows.
ring_opening = "time1=1980-01-01T00:00:00&time2=2018-01-01T00:00:00&RINGGEOobserverringopeningangle1=-10&RINGGEOobserverringopeningangle2=10"
# The same range with a one-year time range.
ring_opening_year = "time1=2009-01-01T00:00:00&time2=2010-01-01T00:00:00&RINGGEOobserverringopeningangle1=-10&RINGGEOobserverringopeningangle2=10"

# Column sets a pages scenario can ask for (`columns`) in place of the default columns,
# as `cols` values; the scenario is then named `pages.<search>_<columns>`.
[columns]
# Columns from four tables: obs_general, the Cassini ISS table, obs_ring_geometry and
# Saturn's surface geometry.
geometry = "opusid,instrument,target,time1,COISSfilter,RINGGEOringradius1,RINGGEOringradius2,SURFACEGEOsaturn_planetographiclatitude1,SURFACEGEOsaturn_planetographiclatitude2"

# The observation each scale's categories, files and previews scenarios ask about: one
# with surface geometry, which every scale's data holds. The complete scale holds the
# test scale's.
[observations]
fixture = "co-iss-n1622025855"
test = "co-iss-w1477654052"
complete = "co-iss-w1477654052"

# What a user-interface load fans out to: the default widgets' mult counts, the range
# endpoints of the time widget, and the menu, which carries the triggered tables.
[fanout]
mult_widgets = ["instrument", "observationtype", "target"]
range_slugs = ["time1"]

# The mult counts a mults scenario asks for after the default widgets': a widget on
# obs_type_image, a child table holding one row for each observation.
[mults]
widgets = ["imagetype"]

# The order a re-sort asks for, in place of the default.
[resort]
order = "-time1,opusid"

[[scenarios]]
kind = "search"
search = "empty"

[[scenarios]]
kind = "search"
search = "broad"

[[scenarios]]
kind = "search"
search = "selective"

[[scenarios]]
kind = "search"
search = "ring_radius"

[[scenarios]]
kind = "search"
search = "target"

[[scenarios]]
kind = "search"
search = "surface_geometry"

[[scenarios]]
kind = "search"
search = "complex"

[[scenarios]]
kind = "search"
search = "ring_opening"

[[scenarios]]
kind = "search"
search = "ring_opening_year"

[[scenarios]]
kind = "pages"
search = "empty"

[[scenarios]]
kind = "pages"
search = "broad"

[[scenarios]]
kind = "pages"
search = "selective"

[[scenarios]]
